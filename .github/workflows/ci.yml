name: CI Frontend - Agenda Escolar Digital

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Instalar dependências
        working-directory: ./agendaDigitalCem
        run: npm install

      - name: Executar testes automatizados
        run: npm test
